name: Sync
slug: sync
type: plugin
version: 1.1.4
description: Real-time collaboration substrate for Grav. Stores Yjs CRDT updates and presence state for multi-user editing. Transport-agnostic; works with polling, Mercure, or WebSocket providers. Runs on Grav 1.7 and 2.0; integrates with the api plugin when available.
icon: rotate
author:
  name: Team Grav
  email: devs@getgrav.org
  url: https://getgrav.org
homepage: https://github.com/getgrav/grav-plugin-sync
keywords: collaboration, yjs, crdt, realtime, sync
bugs: https://github.com/getgrav/grav-plugin-sync/issues
license: MIT
compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: '>=1.7.49' }
  - { name: login, version: '>=3.8.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_SYNC.ENABLED.LABEL
      highlight: 1
      default: 1
      options:
        1: PLUGIN_SYNC.ENABLED.OPTIONS.ENABLED
        0: PLUGIN_SYNC.ENABLED.OPTIONS.DISABLED
      validate:
        type: bool

    section_transports:
      type: section
      title: PLUGIN_SYNC.SECTION_TRANSPORTS.TITLE
      underline: true

    transport_preference:
      type: array
      label: PLUGIN_SYNC.TRANSPORT_PREFERENCE.LABEL
      help: PLUGIN_SYNC.TRANSPORT_PREFERENCE.HELP
      value_only: true
      create: false
      data-options@: '\Grav\Plugin\Sync\Transport\TransportRegistry::availableTransports'
      validate:
        type: array

    section_storage:
      type: section
      title: PLUGIN_SYNC.SECTION_STORAGE.TITLE
      underline: true

    storage.adapter:
      type: select
      label: PLUGIN_SYNC.STORAGE_ADAPTER.LABEL
      default: auto
      help: PLUGIN_SYNC.STORAGE_ADAPTER.HELP
      options:
        auto: PLUGIN_SYNC.STORAGE_ADAPTER.OPTIONS.AUTO
        file: PLUGIN_SYNC.STORAGE_ADAPTER.OPTIONS.FILE
        sqlite: PLUGIN_SYNC.STORAGE_ADAPTER.OPTIONS.SQLITE

    section_squash:
      type: section
      title: PLUGIN_SYNC.SECTION_SQUASH.TITLE
      underline: true

    squash.idle_seconds:
      type: number
      label: PLUGIN_SYNC.SQUASH_IDLE_SECONDS.LABEL
      default: 60
      help: PLUGIN_SYNC.SQUASH_IDLE_SECONDS.HELP
      validate:
        type: int
        min: 5

    squash.max_log_bytes:
      type: number
      label: PLUGIN_SYNC.SQUASH_MAX_LOG_BYTES.LABEL
      default: 524288
      help: PLUGIN_SYNC.SQUASH_MAX_LOG_BYTES.HELP
      validate:
        type: int
        min: 4096

    section_presence:
      type: section
      title: PLUGIN_SYNC.SECTION_PRESENCE.TITLE
      underline: true

    presence.ttl_seconds:
      type: number
      label: PLUGIN_SYNC.PRESENCE_TTL_SECONDS.LABEL
      default: 30
      help: PLUGIN_SYNC.PRESENCE_TTL_SECONDS.HELP
      validate:
        type: int
        min: 5

    section_polling:
      type: section
      title: PLUGIN_SYNC.SECTION_POLLING.TITLE
      underline: true

    polling.idle_interval_ms:
      type: number
      label: PLUGIN_SYNC.POLLING_IDLE_INTERVAL_MS.LABEL
      default: 4000
      help: PLUGIN_SYNC.POLLING_IDLE_INTERVAL_MS.HELP
      validate:
        type: int
        min: 500

    polling.active_interval_ms:
      type: number
      label: PLUGIN_SYNC.POLLING_ACTIVE_INTERVAL_MS.LABEL
      default: 1000
      help: PLUGIN_SYNC.POLLING_ACTIVE_INTERVAL_MS.HELP
      validate:
        type: int
        min: 250
