enabled: true

# transport_preference: configured in the admin. When empty, sync falls back
# to each transport's built-in priority() value (Mercure 50, Ably 40,
# polling 0) so behaviour matches pre-2026 installs out of the box.
transport_preference: []

storage:
  adapter: auto

squash:
  idle_seconds: 60
  max_log_bytes: 524288

presence:
  ttl_seconds: 30

polling:
  idle_interval_ms: 4000
  active_interval_ms: 1000
