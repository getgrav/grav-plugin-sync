PLUGIN_SYNC:
  SECTION_TRANSPORTS: 'Transports'
  TRANSPORT_PREFERENCE: 'Transport Preference Order'
  TRANSPORT_PREFERENCE_HELP: 'Drag rows to reorder. The first available transport in the list handles live delivery; later rows serve as fallbacks. Only transports installed in this Grav instance appear in the dropdown — leave empty to fall back to each transport''s built-in priority.'
  SECTION_STORAGE: 'Storage'
  STORAGE_ADAPTER: 'Storage Adapter'
  STORAGE_ADAPTER_HELP: 'Where Yjs update logs and snapshots are persisted. Auto prefers SQLite when the pdo_sqlite PHP extension is available and falls back to File otherwise. SQLite is recommended for high-concurrency sites — it avoids file-lock contention and survives unclean shutdowns better.'
  STORAGE_ADAPTER_AUTO: 'Auto (prefer SQLite when available)'
  STORAGE_ADAPTER_FILE: 'File (append-only log per room)'
  STORAGE_ADAPTER_SQLITE: 'SQLite (one database per room)'
  STORAGE_PRUNE_AFTER_DAYS: 'Remove unused rooms after'
  STORAGE_PRUNE_AFTER_DAYS_HELP: "Days a page's collaboration history is kept after the last edit to it. A page that is deleted, renamed, or has its template changed leaves its history behind with nothing else to clean it up. Set to 0 to keep everything."
  SECTION_SQUASH: 'Squash'
  SQUASH_IDLE_SECONDS: 'Idle Timeout (seconds)'
  SQUASH_IDLE_SECONDS_HELP: 'How long a room must have no presence before the collaboration log is squashed back into the canonical markdown file and truncated.'
  SQUASH_MAX_LOG_BYTES: 'Max Log Size (bytes)'
  SQUASH_MAX_LOG_BYTES_HELP: 'Forces an immediate squash when the update log grows beyond this size, regardless of activity. Default 512KB.'
  SECTION_PRESENCE: 'Presence'
  PRESENCE_TTL_SECONDS: 'Heartbeat TTL (seconds)'
  PRESENCE_TTL_SECONDS_HELP: 'How long a client is considered present after its last heartbeat. Tabs that disappear without explicit disconnect time out after this.'
  SECTION_POLLING: 'Polling Defaults'
  POLLING_IDLE_INTERVAL_MS: 'Idle Poll Interval (ms)'
  POLLING_IDLE_INTERVAL_MS_HELP: 'How often clients poll when editing alone. Clients use this as a default; servers can suggest a different cadence in the capabilities response.'
  POLLING_ACTIVE_INTERVAL_MS: 'Active Poll Interval (ms)'
  POLLING_ACTIVE_INTERVAL_MS_HELP: 'How often clients poll when at least one other collaborator is present in the same room.'

